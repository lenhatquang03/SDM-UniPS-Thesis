# Rule C, shuffled-energy arm. Identical to modelZ.yaml except session_name and the
# energy_shuffle keys. Each training draw permutes the 64x64 energy cells of every scene
# (per_step). energy_shuffle_tau MUST be set to the value fixed by the ESS-matching probe
# (rule_c_real vs rule_c_shuf) before launch; the placeholder makes the launch fail.
# CLAIM SCOPE (decided 2026-11-21): this arm supports only "WESS-IW beats a
# concentration-matched (ESS-matched) random-placement sampler". It does NOT control
# cluster morphology: the real draw follows contiguous crease ridges, the shuffled draw
# lands on scattered 8-16 px blobs (and the whole-frame permutation moves rim/background
# cells into the interior). A morphology-matched null is the follow-up, only if Z wins here.
# The logged wess_tilt_int / wess_top10_frac are measured against the SHUFFLED energy,
# so they do not show the null; only wess_ess is comparable across the two arms.
# Launch:
#   NUMPY_MADVISE_HUGEPAGE=0 PYTHONUNBUFFERED=1 nohup python -u sdm_unips/train.py \
#       --config sdm_unips/configs/modelZshuf.yaml < /dev/null > /workspace/runs/modelZshuf.log 2>&1 &
# Model Z: decoupled context/query decoder on the B2-IW sampler (--decouple_context).
# Branch modelZ-decoupled (from modelC-wess 51b9668). Identical to modelB2_iw.yaml except
# session_name and decouple_context. Compare with B2-IW (only the decoder differs) and B1
# (= the X baseline, see context_handoff_Z.md). Launch:
#   NUMPY_MADVISE_HUGEPAGE=0 PYTHONUNBUFFERED=1 nohup python -u sdm_unips/train.py \
#       --config sdm_unips/configs/modelZ.yaml < /dev/null > /workspace/runs/modelZ.log 2>&1 &
#
#   NUMPY_MADVISE_HUGEPAGE=0 PYTHONUNBUFFERED=1 nohup python -u sdm_unips/train.py \
#       --config sdm_unips/configs/modelB2_iw.yaml \
#       < /dev/null > /workspace/runs/modelB2_iw.log 2>&1 &
#
# Every training setting is Model A's config.json (modelA/logs/config.json)
# except session_name, scene_manifest, the wess_* block, and the SCHEDULE,
# which is pinned to A's realized ramp instead of rediscovered:
#
#   A ran with --auto_decay and --epochs 200; its ramp branched at step
#   56592 and ran 8,640 steps to 65232 = 151 epochs x 432 steps/epoch.
#   epochs 151 + decay_from_step 56592 + decay_fraction 0.13245 reproduce
#   that ramp exactly (round(0.13245 x 65232) = 8640), so this run's LR
#   equals A's at every step. auto_decay is OFF: the schedule is a shared
#   hyperparameter chosen once, not a per-variant tune.
#
# Values equal to train.py current defaults are still written out, so a
# later change of default cannot alter this run. The command line wins
# over this file.
#
# Probe at this setting (wess_site_probe.py, B1 weights, n=431):
#   ESS 0.388, energy tilt 2.10, curvature tilt 1.193, net MAE gain +0.484 +- 0.054 deg
#
# CHECK before launching: hdlong_dir / polarps_dir must exist on this box
# (hdlong-complexv1 BEFORE MerlMix -- root order is part of the split), and
# startup must print fingerprint=dca709407e0adb11.

# I/O and scene pool
session_name: /workspace/runs/modelZshuf
hdlong_dir:
  - /workspace/data/mnt/8TData/Datasets/UniPS/hdlong-complexv1
  - /workspace/data/mnt/8TData/Datasets/UniPS/MerlMix
polarps_dir:
  - /workspace/data/mnt/8TData/Datasets/UniPS/PolarPS
train_dir: null
scene_manifest: /workspace/runs/modelA/logs/scene_manifest.json
log_dir: null
checkpoint_dir: null
seed: 42
max_scenes: 0
k_per_scene: 10
strict_scenes: false
max_bad_scene_frac: 0.05

# Splits and evaluation
val_fraction: 0.1
test_fraction: 0.1
test_trials: 5
val_every_epochs: 1

# WESS sampler -- identical to modelB2_wess.yaml except wess_iw
wess_tau: 1.0
wess_lam: 0.25
wess_erode_cells: 2
wess_top_k: 2
wess_iw: true          # loss x 1/(n_valid * p): same expected target as Model A
decouple_context: true   # Model Z: uniform context U, queries Q, loss on Q only
energy_shuffle: per_step        # Rule C: per scene, fresh permutation at every draw
energy_shuffle_tau: 1.35  # tau_s from the --shipped_sampler probe (rule_c_real, rule_c_shuf; 2026-11-21): ESS and interior gates pass

# Resolution and batch (effective batch = batch_size x accum_steps = 8)
train_resolution: 512
canonical_resolution: 256
batch_size: 2
accum_steps: 4
pixel_samples: 2048

# Optimisation and LR schedule -- pinned to A's realized ramp
epochs: 151
lr: 0.0001
weight_decay: 0.05
lr_schedule: wsd
warmup_epochs: 5.0
min_lr_ratio: 0.01
decay_fraction: 0.13245
decay_from_step: 56592
decay_now: false
lr_decay_every: 10
lr_decay_gamma: 0.8
auto_decay: false
auto_decay_rel: 0.005
auto_decay_patience: 10
auto_decay_min_epoch: 40
patience: 0
min_delta: 0.0
grad_clip: 1.0
amp: false
amp_dtype: bf16

# Gradient guards (explode_factor and gn_* logging are the 2026-09-19 commit)
max_consecutive_skips: 20
max_skip_rate: 0.3
skip_rate_window: 200
explode_factor: 100.0
no_branch_grads: false
detect_anomaly: false

# Loader and memory
num_workers: 8
prefetch_factor: 2
max_vram_gib: 31.0
log_memory: false

# Logging, checkpoints, resume
log_every: 10
ckpt_every: 1000
keep_last: 5
keep_last_steps: 2
resume: auto
pretrained: null
allow_config_change: false

# Off-box backup (uploads to <hf_repo>/sdm-ckpt/modelZshuf/)
hf_backup: true
hf_backup_every: 5
hf_repo: culacgiontan0312/UniPS
hf_repo_type: dataset

# Smoke test (inactive while smoke_test is false)
smoke_test: false
smoke_epochs: 10
smoke_max_scenes: 0
