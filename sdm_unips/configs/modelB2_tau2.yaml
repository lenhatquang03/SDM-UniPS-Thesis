# Model B2 (WESS) -- milder tilt. Branch modelC-wess.
#
#   NUMPY_MADVISE_HUGEPAGE=0 PYTHONUNBUFFERED=1 nohup python -u sdm_unips/train.py \
#       --config sdm_unips/configs/modelB2_tau2.yaml \
#       < /dev/null > /workspace/runs/modelB2_tau2.log 2>&1 &
#
# Every training setting is Model A's config.json (modelA/logs/config.json)
# except session_name, scene_manifest, the wess_* block, and the SCHEDULE,
# which is pinned to A's realized ramp instead of rediscovered:
#
#   A ran with --auto_decay and --epochs 200; its ramp branched at step
#   56592 and ran 8,640 steps to 65232 = 151 epochs x 432 steps/epoch.
#   epochs 151 + decay_from_step 56592 + decay_fraction 0.13245 reproduce
#   that ramp exactly (round(0.13245 x 65232) = 8640), so this run's LR
#   equals A's at every step. auto_decay is OFF: the schedule is a shared
#   hyperparameter chosen once, not a per-variant tune.
#
# Values equal to train.py current defaults are still written out, so a
# later change of default cannot alter this run. The command line wins
# over this file.
#
# Probe at this setting (wess_site_probe.py, B1 weights, n=431):
#   ESS 0.821, energy tilt 1.45, curvature tilt 1.099, net MAE gain +0.216 +- 0.032 deg
#
# CHECK before launching: hdlong_dir / polarps_dir must exist on this box
# (hdlong-complexv1 BEFORE MerlMix -- root order is part of the split), and
# startup must print fingerprint=dca709407e0adb11.

# I/O and scene pool
session_name: /workspace/runs/modelB2_tau2
hdlong_dir:
  - /workspace/data/mnt/8TData/Datasets/UniPS/hdlong-complexv1
  - /workspace/data/mnt/8TData/Datasets/UniPS/MerlMix
polarps_dir:
  - /workspace/data/mnt/8TData/Datasets/UniPS/PolarPS
train_dir: null
scene_manifest: /workspace/runs/modelA/logs/scene_manifest.json
log_dir: null
checkpoint_dir: null
seed: 42
max_scenes: 0
k_per_scene: 10
strict_scenes: false
max_bad_scene_frac: 0.05

# Splits and evaluation
val_fraction: 0.1
test_fraction: 0.1
test_trials: 5
val_every_epochs: 1

# WESS sampler -- the only intended difference between these six runs
wess_tau: 2.0
wess_lam: 0.25
wess_erode_cells: 2
wess_top_k: 2

# Resolution and batch (effective batch = batch_size x accum_steps = 8)
train_resolution: 512
canonical_resolution: 256
batch_size: 2
accum_steps: 4
pixel_samples: 2048

# Optimisation and LR schedule -- pinned to A's realized ramp
epochs: 151
lr: 0.0001
weight_decay: 0.05
lr_schedule: wsd
warmup_epochs: 5.0
min_lr_ratio: 0.01
decay_fraction: 0.13245
decay_from_step: 56592
decay_now: false
lr_decay_every: 10
lr_decay_gamma: 0.8
auto_decay: false
auto_decay_rel: 0.005
auto_decay_patience: 10
auto_decay_min_epoch: 40
patience: 0
min_delta: 0.0
grad_clip: 1.0
amp: false
amp_dtype: bf16

# Gradient guards (explode_factor and gn_* logging are the 2026-09-19 commit)
max_consecutive_skips: 20
max_skip_rate: 0.3
skip_rate_window: 200
explode_factor: 100.0
no_branch_grads: false
detect_anomaly: false

# Loader and memory
num_workers: 8
prefetch_factor: 2
max_vram_gib: 30.0
log_memory: false

# Logging, checkpoints, resume
log_every: 10
ckpt_every: 1000
keep_last: 5
keep_last_steps: 2
resume: auto
pretrained: null
allow_config_change: false

# Off-box backup (uploads to <hf_repo>/sdm-ckpt/modelB2_tau2/)
hf_backup: true
hf_backup_every: 5
hf_repo: culacgiontan0312/UniPS
hf_repo_type: dataset

# Smoke test (inactive while smoke_test is false)
smoke_test: false
smoke_epochs: 10
smoke_max_scenes: 0
